<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Clip Maker</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <main class="app-wrapper">
        <div class="card" id="app-card">

            <header class="card-header">
                <h1 class="app-title">
                    <i data-lucide="sparkles" class="title-icon"></i>
                    AI Clip Maker
                </h1>
                <p class="app-subtitle">Upload a video and generate one viral clip automatically.</p>
            </header>

            <section class="form-section">
                <label for="apiKey" class="input-label">Gemini API Key</label>
                <div class="input-wrapper">
                    <i data-lucide="key-round" class="input-icon"></i>
                    <input type="password" id="apiKey" placeholder="Enter your Gemini API key here" autocomplete="off">
                </div>
            </section>

            <button id="uploadWidget" class="upload-btn">
                <i data-lucide="upload"></i>
                Upload files
            </button>

            <p id="status" class="status-text">Waiting for your upload.</p>

            <figure class="video-wrapper">
                <video id="video" controls></video>
            </figure>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
    <script src="src/js/script.js" type="text/javascript"></script>

</body>

</html>
